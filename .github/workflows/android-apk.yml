name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reclaim space used by preinstalled toolchains this build doesn't need
      - name: Free up disk space
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/dotnet /opt/ghc /usr/local/share/azure-cli /usr/local/share/powershell
          rm -rf "${HOME}/.dotnet"
          sudo apt-get clean
          df -h /

      - uses: jdx/mise-action@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trust and install mise tools
        run: |
          mise trust
          mise install

      - name: Run unit tests
        run: mise run test

      - name: Disk before build
        run: df -h /

      - name: Build release APK
        run: mise run build-apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: fuel-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
