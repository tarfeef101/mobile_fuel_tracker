name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reclaim space used by preinstalled toolchains this build doesn't need
      - name: Free up disk space
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/dotnet /opt/ghc /usr/local/share/azure-cli /usr/local/share/powershell
          rm -rf "${HOME}/.dotnet"
          sudo apt-get clean
          df -h /

      - uses: jdx/mise-action@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trust and install mise tools
        run: |
          mise trust
          mise install

      # PRs (and manual dispatches) run the full test pass; main builds only
      - name: Run unit tests
        if: github.event_name != 'push'
        run: mise run test

      - name: Build release APK
        run: mise run build-apk

      # main publishes the APK as a GitHub Release tagged with the commit hash
      - name: Publish release
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:12}"
          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag" \
            --title "$(git log -1 --pretty=%s)" \
            --notes "$(git log -1 --pretty=%b)" \
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GH_TOKEN: ${{ github.token }}
