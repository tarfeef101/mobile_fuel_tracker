[tools]
flutter = "3.47.6"
# Temurin: plain 17.0.2 (jdk.java.net) NPEs in the AGP lint worker on cgroup v2 runners
java = "temurin-17.0.20+8"
android-sdk = "23.0"

# Google deprecated sdkmanager in favor of the `android` CLI (no license
# prompts since cmdline-tools 23.0), so use it directly.
[tasks.android-setup]
description = "Provision Android SDK packages (idempotent)"
# bash explicitly: runners default to /bin/sh (dash), which lacks pipefail
shell = "bash -c"
run = """
set -euo pipefail
android --no-metrics sdk install platform-tools "platforms;android-36" "build-tools;36.0.0"
# Pre-install the NDK (AGP would auto-install it per-run); the ~1GB
# dl.google.com download is flaky in CI, so retry.
# Version must match the NDK shipped with the pinned Flutter.
for i in 1 2 3; do
  if android --no-metrics sdk install "ndk;28.2.13676358"; then
    exit 0
  fi
  echo "NDK install attempt $i failed, retrying in 10s..."
  sleep 10
done
echo "NDK install failed after 3 attempts" >&2
exit 1
"""

[tasks.build-apk]
description = "Build the release APK"
depends = ["android-setup"]
shell = "bash -c"
run = """
set -euo pipefail
flutter pub get
flutter build apk --release
"""

[tasks.test]
description = "Run Flutter unit tests"
run = "flutter test"
