name: fuel_tracker
description: "Fuel Economy Tracker — Android fuel tracking with local encryption and optional AWS cloud sync"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

# Use the SQLCipher build of the bundled SQLite (drift talks to it via
# package:sqlite3; the key is set in lib/data/database.dart).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.2
  sqlite3: ^3.7.1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  uuid: ^4.5.1
  intl: ^0.20.3
  http: ^1.2.2
  meta: ^1.15.0
  crypto: ^3.0.7
  fl_chart: ^1.2.0
  workmanager: ^0.10.10
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  dynamic_color: ^2.1.0
  material_ui: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.4.13

# Temporary: the b245858 bump (shared_preferences_android 2.5.1's Pigeon-JNI
# rewrite + jni_flutter 1.0.4+1) hangs on the splash screen on-device.
# Pinned to pre-bump versions until the root cause is confirmed.
dependency_overrides:
  shared_preferences: 2.5.5
  shared_preferences_android: 2.4.28
  jni_flutter: 1.0.3

flutter:
  uses-material-design: true
