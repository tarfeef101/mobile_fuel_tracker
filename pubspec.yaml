name: fuel_tracker
description: "A fuel tracking app for Android with local encryption and optional AWS backup"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.21.0
  drift_sqflite: ^2.0.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  uuid: ^4.5.1
  intl: ^0.20.3
  # Using the correct AWS package - updated to latest compatible version
  http: ^1.2.2
  meta: ^1.15.0
  aws_signature_v4: ^0.6.13
  flutter_slidable: ^4.0.3
  flutter_screenutil: ^5.9.3
  dynamic_color: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true