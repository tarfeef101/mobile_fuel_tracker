name: fuel_tracker
description: "A fuel tracking app for Android with local encryption and optional AWS backup"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

# Use the SQLCipher build of the bundled SQLite (drift talks to it via
# package:sqlite3; the key is set in lib/data/database.dart).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.21.0
  sqlite3: ^3.7.0
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  uuid: ^4.5.1
  intl: ^0.20.3
  http: ^1.2.2
  meta: ^1.15.0
  aws_signature_v4: ^0.6.13
  flutter_slidable: ^4.0.3
  flutter_screenutil: ^5.9.3
  dynamic_color: ^2.1.0
  material_ui: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
